name = "bottle-tracker-vision-proxy"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# Origin allowed to call the proxy (your GitHub Pages site).
[vars]
ALLOWED_ORIGIN = "https://thisis-romar.github.io"

# Secrets (do NOT put these here) — set them with wrangler:
#   wrangler secret put ANTHROPIC_API_KEY   # required
#   wrangler secret put PROXY_SECRET        # optional shared secret
